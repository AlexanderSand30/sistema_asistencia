<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | RL NEXUS TECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
</head>
<body style="margin:0;">

<div class="login-wrapper">

    <!-- PANEL IZQUIERDO: LOGO -->
    <div class="login-brand">
        <img src="{{ url_for('static', filename='img/Tech.png') }}" alt="RL NEXUS TECH">
        <p class="text-light">Sistema de Control de Asistencia</p>
    </div>

    <!-- PANEL DERECHO: FORMULARIO -->
    <div class="login-form-panel">
        <div class="card shadow" style="width: 360px;">
            <div class="card-body p-4">
                <h5 class="mb-4 text-center">Iniciar Sesión</h5>

                <div id="mensajeError" class="alert alert-danger d-none"></div>

                <form id="formLogin">
                    <div class="mb-3">
                        <label>Usuario</label>
                        <input type="text" id="usuario" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                </form>

            </div>
        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='js/login/login.js') }}"></script>
</body>
</html>
