<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | RL NEXUS TECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet" />
</head>

<body>
    <div class="login-wrapper">
        <!-- PANEL IZQUIERDO: LOGO -->
        <div class="login-brand">
            <img src="{{ url_for('static', filename='img/Tech.png') }}" alt="RL NEXUS TECH" />
            <p>Sistema de Control de Asistencia</p>
        </div>

        <!-- PANEL DERECHO: FORMULARIO -->
        <div class="login-form-panel">
            <div class="card">
                <div class="card-body">
                    <h5 class="mb-4 text-center">Iniciar Sesión</h5>

                    {% with mensajes = get_flashed_messages(with_categories=true) %}
                        {% if mensajes %}
                            {% for categoria, mensaje in mensajes %}
                                <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <div id="mensajeError" class="alert alert-danger d-none"></div>

                    <form method="POST" action="{{ url_for('login.login') }}">
                        <div class="mb-3">
                            <label for="usuario">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Ingresa tu usuario" autocomplete="off" required />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" autocomplete="off" required />
                                <span class="input-group-text toggle-password" onclick="togglePassword()">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">Iniciar Sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById("password");
            const icon = document.getElementById("toggleIcon");
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            icon.classList.toggle("bi-eye");
            icon.classList.toggle("bi-eye-slash");
        }
    </script>
</body>

</html>
