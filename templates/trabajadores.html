<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajadores | RL NEXUS TECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sidebar.css') }}" rel="stylesheet">
</head>
<body>

<button class="sidebar-open-btn" id="sidebarOpenBtn" aria-label="Abrir menu">☰</button>

<div class="d-flex">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="{{ url_for('static', filename='img/Tech.png') }}" class="sidebar-logo">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Cerrar menu">☰</button>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
            <a href="/trabajadores" class="nav-link">👤 Trabajadores</a>
            <a href="/asistencia" class="nav-link">📋 Asistencia</a>
            <a href="/reportes" class="nav-link">📊 Reportes</a>
            <a href="/produccion" class="nav-link">🏭 Producción</a>
            <a href="/logout" class="nav-link logout">🚪 Cerrar Sesión</a>
        </nav>
    </div>

    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Módulo Trabajadores</h4>
            <span class="text-muted">Bienvenido, <strong>{{ session.get('nombre', '') }}</strong></span>
        </div>
        <hr>

        <div class="card mb-4">
            <div class="card-body">
                <h6 class="card-title" id="tituloFormulario">Nuevo Trabajador</h6>
                <form id="formTrabajador">
                    <input type="hidden" id="trabajadorId">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label>DNI</label>
                            <input type="text" id="dni" class="form-control" maxlength="8" required>
                        </div>
                        <div class="col-md-3">
                            <label>Nombres</label>
                            <input type="text" id="nombres" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label>Apellidos</label>
                            <input type="text" id="apellidos" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label>Cargo</label>
                            <input type="text" id="cargo" class="form-control">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                        <button type="button" class="btn btn-secondary d-none" id="btnCancelar">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0">Trabajadores Activos</h6>
            <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal"
                    data-bs-target="#modalInactivos" onclick="cargarInactivos()">
                🗂️ Ver Inactivos
            </button>
        </div>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr><th>DNI</th><th>Nombres</th><th>Apellidos</th><th>Cargo</th><th>Acciones</th></tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<!-- MODAL: TRABAJADORES INACTIVOS -->
<div class="modal fade" id="modalInactivos" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Trabajadores Inactivos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table class="table table-bordered">
                    <thead class="table-dark">
                        <tr><th>DNI</th><th>Nombres</th><th>Apellidos</th><th>Cargo</th><th>Acción</th></tr>
                    </thead>
                    <tbody id="cuerpoTablaInactivos"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/trabajadores/sidebar.js') }}"></script>
<script src="{{ url_for('static', filename='js/trabajadores/listar_trabajadores.js') }}"></script>
<script src="{{ url_for('static', filename='js/trabajadores/editar_trabajador.js') }}"></script>
<script src="{{ url_for('static', filename='js/trabajadores/eliminar_trabajador.js') }}"></script>
<script src="{{ url_for('static', filename='js/trabajadores/formulario_trabajador.js') }}"></script>
<script src="{{ url_for('static', filename='js/trabajadores/inactivos_trabajador.js') }}"></script>
</body>
</html>
