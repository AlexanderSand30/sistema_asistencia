<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RL NEXUS TECH{% endblock %} | RL NEXUS TECH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link href="{{ url_for('static', filename='css/errors.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="container-fluid px-3 px-md-4 mt-3">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                <div id="flashMessages" data-messages='{{ mensajes|tojson|e }}'></div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const flashMessages = document.getElementById("flashMessages");
        if (flashMessages) {
            JSON.parse(flashMessages.dataset.messages).forEach(([categoria, mensaje]) => {
                Swal.fire({
                    toast: true,
                    position: "top-end",
                    icon: categoria === "danger" ? "error" : categoria,
                    title: mensaje,
                    showConfirmButton: false,
                    timer: 4000,
                    timerProgressBar: true
                });
            });
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
